# Railway config for the frontend service.
# In the Railway dashboard:
#   - Root Directory: leave empty (monorepo root)
#   - Config-as-code path: railway.frontend.toml
#   - Set build args VITE_API_URL and VITE_CESIUM_ION_ACCESS_TOKEN as needed

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
