services:
  api:
    build:
      target: dev
    command: sh -c "npm install && npm --workspace apps/api run dev"
    environment:
      NODE_ENV: development
      LYNX_CHAT_ENABLED: ${LYNX_CHAT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      API_BIND_HOST: 0.0.0.0
    # Override the production port mapping; opt-in local AI must stay on loopback.
    ports: !override
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    stdin_open: true
    tty: true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npm install && npm --workspace apps/frontend run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_CESIUM_ION_ACCESS_TOKEN: ${VITE_CESIUM_ION_ACCESS_TOKEN:-}
      VITE_SATELLITE_PERF_LOGS: ${VITE_SATELLITE_PERF_LOGS:-true}
      VITE_LYNX_CHAT_ENABLED: ${VITE_LYNX_CHAT_ENABLED:-false}
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  node-modules:
