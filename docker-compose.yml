services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: npm run db:migrate:deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://satellite:satellite@postgres:5432/satellite}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    environment:
      PORT: ${PORT:-3000}
      UPDATE_INTERVAL_MS: ${UPDATE_INTERVAL_MS:-1000}
      LIVE_POSITION_REFRESH_ENABLED: ${LIVE_POSITION_REFRESH_ENABLED:-false}
      OMM_FILE: ${OMM_FILE:-/app/apps/api/data/omm.sample.json}
      DATABASE_URL: ${DATABASE_URL:-postgresql://satellite:satellite@postgres:5432/satellite}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satellite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satellite}
      POSTGRES_DB: ${POSTGRES_DB:-satellite}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satellite} -d ${POSTGRES_DB:-satellite}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_CESIUM_ION_ACCESS_TOKEN: ${VITE_CESIUM_ION_ACCESS_TOKEN:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
